        // --- HELPERS DE COLOR (hex -> rgba / mezcla con blanco para texto legible) ---
        const hexToRgbArr = (hex) => {
            const clean = (hex || '#64748b').replace('#', '');
            const full = clean.length === 3 ? clean.split('').map(c => c + c).join('') : clean;
            const num = parseInt(full, 16);
            if (Number.isNaN(num)) return [100, 116, 139];
            return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
        };
        const rgba = (hex, alpha) => {
            const [r, g, b] = hexToRgbArr(hex);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        };
        const lighten = (hex, amt) => {
            const [r, g, b] = hexToRgbArr(hex);
            const mix = (c) => Math.round(c + (255 - c) * amt);
            return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;

        const buildArchitecturePrompt = (combinedCode) => `Eres un Arquitecto de Software Senior y mentor experto en enseñar código complejo a otros desarrolladores. Tu objetivo es analizar el código proporcionado y extraer su arquitectura principal y flujo lógico, de forma que un desarrollador entienda tanto la "foto general" como el funcionamiento técnico de cada pieza clave, SIN necesidad de leer el código fuente.

REGLA CRÍTICA DE NIVEL DE DETALLE:
Prioriza el ALTO NIVEL. IGNORA el flujo de control menor (condicionales simples, validaciones triviales, getters/setters, bucles de recorrido simple) a menos que representen el motor principal del programa (ej. un event loop, un worker thread central, una máquina de estados). Si tienes duda sobre si un elemento es relevante, pregúntate: "¿Un nuevo miembro del equipo necesita saber esto en su primer día para entender el sistema?". Si la respuesta es no, omítelo.

LÍMITE DE COMPLEJIDAD: Genera como máximo 25 nodos. Si el código es muy extenso, agrupa componentes relacionados en un único nodo (ej. "Módulo de validación de inputs") en lugar de crear uno por función.

Crea nodos EXCLUSIVAMENTE para estos 5 tipos:
1. "class" — Clases, structs o módulos. Define su rol en el dominio.
2. "function" — Funciones o métodos clave. Explica su algoritmo principal, no su sintaxis.
3. "io" — Operaciones de I/O, hardware, red o APIs externas. Detalla la interfaz física o de red (protocolo, formato de datos, dirección del flujo).
4. "variable" — Variables globales, estado compartido o configuración persistente. Qué almacenan y por qué importan para el resto del sistema.
5. "control" — Bucles principales/infinitos o máquinas de estado que gobiernan el ciclo de vida del programa.

REGLAS DE SALIDA (MUY IMPORTANTE):
- Responde ÚNICAMENTE con el JSON, sin texto antes ni después, sin explicaciones, sin bloques de markdown (nada de \`\`\`json).
- El JSON debe ser válido y parseable: SIN comentarios, SIN comas finales (trailing commas), todas las claves y strings entre comillas dobles.
- Todos los "from"/"to" en "edges" y "nodeId" en "flow" deben corresponder exactamente a un "id" existente en "nodes". No inventes referencias.
- Si el código abarca varios archivos, usa el campo "file" para dejarlo explícito en cada nodo.
- Escribe todo el contenido textual (summary, purpose, labels, explanations) en español.

Estructura exacta a devolver:
{
  "summary": "Resumen didáctico y completo (3-4 líneas): objetivo del código, patrón arquitectónico principal (ej. productor-consumidor, MVC, singleton) y qué problema de negocio o técnico resuelve.",
  "nodes": [
    {
      "id": "n1",
      "type": "class",
      "label": "Nombre exacto del componente tal como aparece en el código",
      "purpose": "Responsabilidad única del componente y algoritmo o lógica interna clave, explicado en términos entendibles sin leer el código.",
      "inputs": "Datos concretos, tipos o estados previos que necesita para funcionar",
      "outputs": "Qué devuelve exactamente, qué estados muta o qué efectos secundarios produce",
      "lines": [1, 10],
      "file": "nombre_archivo.cpp",
      "x": 100,
      "y": 80
    }
  ],
  "edges": [
    {
      "from": "n1",
      "to": "n2",
      "label": "Verbo que describe la relación (ej. 'Inicializa', 'Pasa datos a', 'Llama a', 'Escucha eventos de')",
      "type": "control-flow"
    }
  ],
  "flow": [
    {
      "nodeId": "n1",
      "explanation": "Narrativa del paso: qué hace el sistema en este punto temporal y por qué, justificando el cambio de estado o la llamada siguiente."
    }
  ]
}

Nota sobre "edges[].type": usa "control-flow" cuando un componente invoca o dispara a otro, y "data-flow" cuando un componente únicamente le pasa datos sin controlar su ejecución. Esto se usará para colorear las conexiones en el diagrama.

REGLAS DE DISEÑO DE COORDENADAS (x, y):
- Organiza los nodos en jerarquía estricta de arriba hacia abajo (Top-Down): nivel 0 (globales/entry point) en y=80, nivel 1 en y=300, nivel 2 en y=520, nivel 3 en y=740, y así incrementando en +220 por cada nivel adicional.
- Dentro de una misma capa (mismo y), distribuye los nodos horizontalmente centrados alrededor de x=400, con un mínimo de 350px de separación entre centros (ej. con 3 nodos: x=50, x=400, x=750) para evitar solapamiento de textos largos.
- Si una capa tiene más de 4 nodos, permite continuar el mismo nivel y en filas adicionales desplazadas +150px en y, en lugar de comprimir el espaciado horizontal por debajo de 350px.

${combinedCode}`;

        const estimateTokens = (text) => Math.ceil(text.length / 3.5);

        const sanitizeAIData = (raw) => {
            const nodes = Array.isArray(raw?.nodes)
                ? raw.nodes.filter(n => n && typeof n.id === 'string' && typeof n.label === 'string')
                    .map(n => ({
                        id: n.id,
                        type: NODE_TYPES[n.type] ? n.type : 'function',
                        label: n.label,
                        purpose: typeof n.purpose === 'string' ? n.purpose : 'Sin descripción disponible.',
                        inputs: n.inputs ?? '-',
                        outputs: n.outputs ?? '-',
                        lines: Array.isArray(n.lines) && n.lines.length === 2 ? n.lines : [1, 1],
                        file: typeof n.file === 'string' ? n.file : 'Desconocido',
                        x: typeof n.x === 'number' ? n.x : 100,
                        y: typeof n.y === 'number' ? n.y : 80,
                    }))
                : [];

            const nodeIds = new Set(nodes.map(n => n.id));

            const edges = Array.isArray(raw?.edges)
                ? raw.edges.filter(e => e && nodeIds.has(e.from) && nodeIds.has(e.to))
                    .map(e => ({ from: e.from, to: e.to, label: typeof e.label === 'string' ? e.label : '', type: e.type === 'data-flow' ? 'data-flow' : 'control-flow' }))
                : [];

            const flow = Array.isArray(raw?.flow)
                ? raw.flow.filter(f => f && nodeIds.has(f.nodeId))
                    .map(f => ({ nodeId: f.nodeId, explanation: typeof f.explanation === 'string' ? f.explanation : '' }))
                : [];

            return {
                summary: typeof raw?.summary === 'string' && raw.summary.trim() ? raw.summary : 'No se recibió un resumen legible del modelo.',
                nodes, edges, flow,
            };
        };

        // PERF: componente memoizado -- solo se vuelve a renderizar si cambian sus props
        // (node, active, dragging, theme). Así, arrastrar/paneo/edición de texto no fuerza
        // el re-render de los ~25 nodos del diagrama.
        const NodeBlock = React.memo(function NodeBlock({ node, active, dragging, theme, onNodeMouseDown, registerRef }) {
            const IconComponent = Icons[NODE_TYPES[node.type]?.icon] || Icons.Code;
            const className = `node-block absolute z-10 w-40 p-3 rounded-xl border backdrop-blur-md cursor-pointer select-none${active ? ' node-active' : ''}`;
            return (
                <div
                    ref={(el) => registerRef(node.id, el)}
                    onMouseDown={(e) => onNodeMouseDown(e, node)}
                    className={className}
                    style={{
                        left: node.x,
                        top: node.y,
                        backgroundColor: theme.background,
                        borderColor: theme.border,
                        color: theme.text,
                        boxShadow: active ? `0 0 0 2px #818cf8, ${theme.glowActive}` : theme.glow,
                        transform: dragging ? 'scale(1.05)' : 'scale(1)',
                        transition: 'box-shadow 150ms, background-color 150ms, border-color 150ms'
                    }}
                >
                    <div className="flex flex-col items-center justify-center space-y-1">
                        <div className="opacity-80 mb-1"><IconComponent /></div>
                        <span className="text-xs font-semibold font-mono truncate w-full text-center">{node.label}</span>
                    </div>
                </div>
            );
        });

            const [geminiApiKey, setGeminiApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
            const [geminiModel, setGeminiModel] = useState(localStorage.getItem('gemini_selected_model') || 'gemini-1.5-flash');
            const [availableGeminiModels, setAvailableGeminiModels] = useState([]);
            
            // Estados Local (Ollama)
            const [ollamaModel, setOllamaModel] = useState(localStorage.getItem('ollama_model') || 'qwen2.5-coder:7b');
            const [availableOllamaModels, setAvailableOllamaModels] = useState([]);
            const [useGpu, setUseGpu] = useState(true);
            const [ollamaStatus, setOllamaStatus] = useState({ state: 'idle', message: '' });

            // Estado de UI de Ajustes
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [aiStatus, setAiStatus] = useState("Esperando código...");
            const [aiStatusLevel, setAiStatusLevel] = useState("info");
            const [showSettings, setShowSettings] = useState(false);
            const [settingsTab, setSettingsTab] = useState(apiMode);
            const [newFileModal, setNewFileModal] = useState(false);
            const [newFileName, setNewFileName] = useState('');

            // --- PALETA DE COLORES (persistida en localStorage) ---
            const [palette, setPalette] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('node_palette') || '{}');
                    return { ...DEFAULT_PALETTE, ...saved };
                } catch {
                    return DEFAULT_PALETTE;
                }
            });
            const updatePaletteColor = (type, hex) => {
                setPalette(prev => {
                    const next = { ...prev, [type]: hex };
                    localStorage.setItem('node_palette', JSON.stringify(next));
                    return next;
                });
            };
            const resetPalette = () => {
                setPalette(DEFAULT_PALETTE);
                localStorage.setItem('node_palette', JSON.stringify(DEFAULT_PALETTE));
            };

            const canvasRef = useRef(null);
            const canvasContentRef = useRef(null);
            const lineNumbersRef = useRef(null);
            const textareaRef = useRef(null); 
            const [draggingNodeId, setDraggingNodeId] = useState(null);
            const nodeElRefs = useRef({});
            const dragInfoRef = useRef({ id: null, startMouseX: 0, startMouseY: 0, nodeStartX: 0, nodeStartY: 0, dx: 0, dy: 0 });
            const panInfoRef = useRef({ startX: 0, startY: 0, baseX: 0, baseY: 0, currentX: 0, currentY: 0 });
            const abortControllerRef = useRef(null);

            useEffect(() => { if (geminiApiKey) fetchGeminiModels(geminiApiKey); }, [geminiApiKey]);
            useEffect(() => { fetchOllamaModels(); }, []);
            useEffect(() => { filesRef.current = files; }, [files]);

            const fetchGeminiModels = async (key) => {
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models`, {
                        headers: { 'x-goog-api-key': key }
                    });
                    if (!res.ok) throw new Error("API Key inválida");
                    const responseData = await res.json();
                    const validModels = responseData.models.filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"));
                    setAvailableGeminiModels(validModels);
                    if (!geminiModel || !validModels.find(m => m.name === geminiModel)) {
                        const defaultModel = validModels.find(m => m.name.includes("flash")) || validModels[0];
                        if (defaultModel) {
                            setGeminiModel(defaultModel.name);
                            localStorage.setItem('gemini_selected_model', defaultModel.name);
                        }
                    }
                } catch (e) {
                    console.error("Error al cargar modelos de Gemini:", e);
                }
            };

            // --- CARGAR MODELOS DESDE OLLAMA ---
            const fetchOllamaModels = async () => {
                try {
                    const res = await fetch('http://localhost:11434/api/tags', { method: 'GET' });
                    if (!res.ok) throw new Error('SERVER_ERROR');
                    const data = await res.json();
                    if (data && Array.isArray(data.models)) {
                        setAvailableOllamaModels(data.models);
                        // Si el modelo actual no está en la lista pero hay modelos, selecciona el primero
                        if (data.models.length > 0 && !data.models.some(m => m.name === ollamaModel)) {
                            setOllamaModel(data.models[0].name);
                            localStorage.setItem('ollama_model', data.models[0].name);
                        }
                    }
                } catch (err) {
                    console.warn("No se pudieron cargar los modelos locales de Ollama automáticamente (¿está apagado o sin CORS?).");
                }
            };

            const verifyLocalModel = async (silent = false) => {
                if (!silent) setOllamaStatus({ state: 'testing', message: 'Verificando conexión con Ollama...' });
                try {
                    const res = await fetch('http://localhost:11434/api/tags', { method: 'GET' });
                    if (!res.ok) throw new Error('SERVER_ERROR');
                    const data = await res.json();
                    
                    const targetModel = ollamaModel.includes(':') ? ollamaModel : `${ollamaModel}:latest`;
                    const modelExists = data.models.some(m => m.name === ollamaModel || m.name === targetModel);
                    
                    setAvailableOllamaModels(data.models);

                    if (modelExists) {
                        if (!silent) setOllamaStatus({ state: 'success', message: `✅ Conexión exitosa. El modelo "${ollamaModel}" está listo.` });
                        return true;
                    } else {
                        if (!silent) setOllamaStatus({ state: 'error', message: `❌ Conectado a Ollama, pero el modelo "${ollamaModel}" NO está instalado. Ejecuta: ollama pull ${ollamaModel}` });
                        return false;
                    }
                } catch (err) {
                    if (!silent) setOllamaStatus({ state: 'error', message: '❌ No se pudo conectar a Ollama. Verifica que el servicio esté corriendo y tenga configurado OLLAMA_ORIGINS="*".' });
                    return false;
                }
            };

            const saveSettings = () => { 
                localStorage.setItem('gemini_api_key', geminiApiKey.trim()); 
                localStorage.setItem('gemini_selected_model', geminiModel);
                localStorage.setItem('ollama_model', ollamaModel.trim()); 
                setShowSettings(false); 
            };

            const toggleApiMode = () => {
                const newMode = apiMode === 'local' ? 'cloud' : 'local';
                setApiMode(newMode);
                localStorage.setItem('api_mode', newMode);
                setSettingsTab(newMode);
            };

            const handleFileUpload = async (e) => {
                const uploadedFiles = Array.from(e.target.files);
                if (uploadedFiles.length === 0) return;

                const readFile = (file) => new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (event) => resolve({ name: file.name, content: event.target.result });
                    reader.onerror = () => reject(new Error(`No se pudo leer ${file.name}`));
                    reader.readAsText(file);
                });

                try {
                    const newFiles = await Promise.all(uploadedFiles.map(readFile));
                    setFiles(prev => {
                        const combined = [...prev, ...newFiles];
                        setActiveFileId(combined.length - 1);
                        return combined;
                    });
                } catch (err) {
                    console.error(err);
                    setAiStatus("Error leyendo uno o más archivos subidos.");
                    setAiStatusLevel("error");
                }
                e.target.value = null;
            };

            const addNewFile = () => {
                setNewFileName(`archivo_${files.length + 1}.cpp`);
                setNewFileModal(true);
            };

            const confirmNewFile = () => {
                const name = newFileName.trim();
                if (name) { setFiles(prev => { setActiveFileId(prev.length); return [...prev, { name, content: "// Escribe código aquí..." }]; }); }
                setNewFileModal(false);
            };

            const removeFile = (idx) => {
                const newFiles = files.filter((_, i) => i !== idx);
                if (newFiles.length === 0) { setFiles([{ name: "main.cpp", content: "" }]); setActiveFileId(0); } 
                else { setFiles(newFiles); setActiveFileId(Math.max(0, idx - 1)); }
            };

            const updateActiveFile = (content) => {
                const newFiles = [...files];
                newFiles[activeFileId] = { ...newFiles[activeFileId], content };
                setFiles(newFiles);
            };

            const handleScroll = () => {
                if (lineNumbersRef.current && textareaRef.current) {
                    lineNumbersRef.current.scrollTop = textareaRef.current.scrollTop;
                }
            };

            useEffect(() => {
                if (activeNode && activeNode.lines && textareaRef.current && files[activeFileId]?.name === activeNode.file) {
                    const startLine = activeNode.lines[0];
                    const lineHeight = 20;
                    const scrollToY = Math.max(0, (startLine - 3) * lineHeight);
                    textareaRef.current.scrollTo({ top: scrollToY, behavior: 'smooth' });
                }
            }, [activeNode, activeFileId, files]);

            const getCombinedCodeForAI = () => files.map(f => `--- ARCHIVO: ${f.name} ---\n${f.content}\n`).join('\n');

            const cancelAnalysis = () => {
                if (abortControllerRef.current) abortControllerRef.current.abort();
                setIsAnalyzing(false);
                setAiStatus("Análisis cancelado.");
                setAiStatusLevel("warning");
            };

            const handleAnalyze = async () => {
                setIsAnalyzing(true); setActiveNode(null); setActiveFlowExplanation(null); setSimStep(-1); setIsPlaying(false);
                setAiStatusLevel("info");
                const combinedCode = getCombinedCodeForAI();
                setView({ x: 0, y: 0, zoom: 1 });

                const estimatedTokens = estimateTokens(combinedCode);
                const CONTEXT_WARNING_THRESHOLD = apiMode === 'local' ? 6000 : 200000;
                if (estimatedTokens > CONTEXT_WARNING_THRESHOLD) {
                    setAiStatus(`Aviso: el proyecto es grande (~${estimatedTokens.toLocaleString()} tokens estimados). La respuesta podría truncarse. Considera analizar por archivo.`);
                    setAiStatusLevel("warning");
                }

                const prompt = buildArchitecturePrompt(combinedCode);
                const controller = new AbortController();
                abortControllerRef.current = controller;

                try {
                    let parsedData;

                    if (apiMode === 'cloud') {
                        if (!geminiApiKey) throw new Error("MISSING_API_KEY");
                        
                        setAiStatus(`Interpretando con ${geminiModel.split('/')[1] || geminiModel} (Cloud)...`);
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${geminiModel}:generateContent`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'x-goog-api-key': geminiApiKey },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }] }],
                                generationConfig: { temperature: 0.15, maxOutputTokens: 8192, responseMimeType: "application/json" }
                            }),
                            signal: controller.signal
                        });

                        if (!response.ok) {
                            if (response.status === 429) throw new Error("RATE_LIMIT");
                            if (response.status === 401 || response.status === 403) throw new Error("MISSING_API_KEY");
                            throw new Error("API_ERROR");
                        }
                        const result = await response.json();
                        const candidate = result.candidates?.[0];
                        if (!candidate || candidate.finishReason === "SAFETY") throw new Error("BLOCKED_OR_EMPTY");
                        let textResp = candidate.content?.parts?.[0]?.text || "";
                        textResp = textResp.replace(/```json/gi, '').replace(/```/g, '').trim();
                        if (!textResp) throw new Error("BLOCKED_OR_EMPTY");
                        parsedData = JSON.parse(textResp);

                    } else {
                        setAiStatus(`Verificando entorno local de Ollama...`);
                        const isOllamaReady = await verifyLocalModel(true);
                        if (!isOllamaReady) throw new Error("OLLAMA_VERIFICATION_FAILED");

                        if (location.protocol === 'https:') {
                            throw new Error("MIXED_CONTENT");
                        }
                        setAiStatus(`Interpretando con ${ollamaModel} (${useGpu ? 'GPU' : 'CPU'})...`);
                        const response = await fetch('http://localhost:11434/api/generate', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                model: ollamaModel,
                                prompt: prompt,
                                format: "json",
                                stream: false,
                                options: { temperature: 0.1, num_ctx: Math.max(8192, estimatedTokens + 2048), num_predict: 4096, num_gpu: useGpu ? 99 : 0 }
                            }),
                            signal: controller.signal
                        });

                        if (!response.ok) throw new Error("OLLAMA_ERROR");
                        const result = await response.json();
                        if (!result.response) throw new Error("BLOCKED_OR_EMPTY");
                        parsedData = JSON.parse(result.response.trim());
                    }

                    const clean = sanitizeAIData(parsedData);
                    if (clean.nodes.length === 0) throw new Error("EMPTY_RESULT");

                    setSessionRequests(prev => prev + 1); 
                    setData(clean);
                    setAiStatus("Interpretación completada.");
                    setAiStatusLevel("info");
                    setIsAnalyzing(false);

                } catch (err) {
                    if (err.name === 'AbortError') return;
                    console.error("Fallo durante el análisis:", err);
                    setAiStatusLevel("error");
                    switch (err.message) {
                        case "MISSING_API_KEY":
                            setAiStatus("Falta o es inválida la API Key de Gemini. Configúrala en ajustes.");
                            setIsAnalyzing(false);
                            break;
                        case "RATE_LIMIT":
                            setAiStatus("Límite de peticiones de Gemini alcanzado. Espera un minuto o cambia de modelo.");
                            setIsAnalyzing(false);
                            break;
                        case "BLOCKED_OR_EMPTY":
                            setAiStatus("El modelo no devolvió contenido (posible filtro de seguridad o corte). Activando heurística...");
                            fallbackHeuristic(combinedCode);
                            break;
                        case "MIXED_CONTENT":
                            setAiStatus("Esta página se sirve por HTTPS y no puede llamar a http://localhost. Usa Cloud Mode o sirve la app por HTTP local.");
                            setIsAnalyzing(false);
                            break;
                        case "OLLAMA_VERIFICATION_FAILED":
                            setAiStatus(`Error crítico: Ollama no responde o falta el modelo "${ollamaModel}". Ábrelo en ajustes para verificar.`);
                            setIsAnalyzing(false);
                            break;
                        case "OLLAMA_ERROR":
                            setAiStatus("Error inesperado al generar con Ollama. Activando heurística...");
                            fallbackHeuristic(combinedCode);
                            break;
                        case "EMPTY_RESULT":
                            setAiStatus("La IA no devolvió nodos válidos. Activando heurística...");
                            fallbackHeuristic(combinedCode);
                            break;
                        default:
                            if (err instanceof SyntaxError) {
                                setAiStatus("La respuesta del modelo no era JSON válido (probable corte por límite de tokens). Activando heurística...");
                            } else {
                                setAiStatus("Fallo en la API. Activando heurística...");
                            }
                            fallbackHeuristic(combinedCode);
                    }
                }
            };

            const fallbackHeuristic = (code) => {
                const nodes = []; const edges = []; const flow = [];
                let cols = 3; let index = 0; let match;
                
                const addNode = (type, label, purpose, lines) => {
                    const id = `n${nodes.length}`;
                    let col = index % cols;
                    let row = Math.floor(index / cols);
                    let layoutX = 100 + (col * 300);
                    let layoutY = 80 + (row * 250);

                    nodes.push({ id, type, label, lines: lines || [1, 2], purpose, inputs: '-', outputs: '-', file: 'Auto-detectado', x: layoutX, y: layoutY });
                    flow.push({ nodeId: id, explanation: `Ejecución / Declaración de ${label}.` });
                    index++; return id;
                };

                const rxClass = /(?:class|struct)\s+([a-zA-Z0-9_]+)/g;
                while ((match = rxClass.exec(code)) !== null) addNode('class', match[1], 'Estructura o Clase detectada.');
                
                const rxFunc = /(?:void|int|float|double|bool|auto|char|std::string)\s+([a-zA-Z0-9_:]+)\s*\(/g;
                while ((match = rxFunc.exec(code)) !== null) {
                    if(!match[1].includes('main')) addNode('function', match[1], 'Función o método local detectado.');
                }

                const rxControl = /\b(if|for|while|switch)\b\s*\(/g;
                while ((match = rxControl.exec(code)) !== null) addNode('control', match[1].toUpperCase() + ' Block', 'Bloque de control o bucle iterativo.');

                if (nodes.length === 0) addNode('function', 'Main Script', 'Bloque principal de ejecución secuencial.');

                setData({ nodes, edges, flow, summary: "Modo Heurístico (Fallo de IA): Se han detectado estructuras usando Regex." });
                setIsAnalyzing(false);
            };

            useEffect(() => {
                let interval;
                if (isPlaying) {
                    interval = setInterval(() => {
                        setSimStep(prev => {
                            if (prev >= data.flow.length - 1) { setIsPlaying(false); return prev; }
                            return prev + 1;
                        });
                    }, 2500); 
                }
                return () => clearInterval(interval);
            }, [isPlaying, data.flow?.length]);

            useEffect(() => {
                if (simStep >= 0 && data.flow && simStep < data.flow.length) {
                    const currentFlow = data.flow[simStep];
                    const node = data.nodes.find(n => n.id === currentFlow.nodeId);
                    if (!node) return;

                    setActiveNode(node);
                    setActiveFlowExplanation(currentFlow.explanation);
                    
                    if (node.file) {
                        const fileIdx = files.findIndex(f => f.name === node.file);
                        if (fileIdx !== -1) setActiveFileId(fileIdx);
                    }
                } else if (simStep === -1 && !isPlaying) {
                    setActiveFlowExplanation(null);
                }
            }, [simStep, data, files, isPlaying]);

            const handleCanvasWheel = useCallback((e) => {
                e.preventDefault();
                if (!canvasRef.current) return;
                
                const rect = canvasRef.current.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const currentView = viewRef.current;
                const zoomIntensity = 0.002;
                const zoomDelta = e.deltaY * -zoomIntensity;
                const newZoom = Math.min(Math.max(0.2, currentView.zoom + zoomDelta), 4);

                const newX = mouseX - (mouseX - currentView.x) * (newZoom / currentView.zoom);
                const newY = mouseY - (mouseY - currentView.y) * (newZoom / currentView.zoom);

                setView({ x: newX, y: newY, zoom: newZoom });
            }, []);

            const handleCanvasMouseDown = (e) => {
                if (!e.target.closest('.node-block')) {
                    setIsCanvasPanning(true);
                    const currentView = viewRef.current;
                    panInfoRef.current = { startX: e.clientX, startY: e.clientY, baseX: currentView.x, baseY: currentView.y, currentX: currentView.x, currentY: currentView.y };
                }
            };

            // PERF: durante el arrastre (pan de canvas o drag de nodo) NO tocamos el estado de React
            // en cada mousemove -- eso forzaría re-render de todos los nodos/aristas muchas veces por segundo.
            // En su lugar aplicamos un transform directo sobre el DOM (vía refs) y solo confirmamos
            // el resultado final en el estado al soltar el ratón (handleGlobalMouseUp).
            const handleGlobalMouseMove = useCallback((e) => {
                if (isCanvasPanning) {
                    const nx = panInfoRef.current.baseX + (e.clientX - panInfoRef.current.startX);
                    const ny = panInfoRef.current.baseY + (e.clientY - panInfoRef.current.startY);
                    panInfoRef.current.currentX = nx;
                    panInfoRef.current.currentY = ny;
                    if (canvasContentRef.current) {
                        canvasContentRef.current.style.transform = `translate(${nx}px, ${ny}px) scale(${viewRef.current.zoom})`;
                    }
                } else if (draggingNodeId && canvasRef.current) {
                    const drag = dragInfoRef.current;
                    if (drag.id !== draggingNodeId) return;
                    const rect = canvasRef.current.getBoundingClientRect();
                    const currentView = viewRef.current;
                    const mouseX = (e.clientX - rect.left - currentView.x) / currentView.zoom;
                    const mouseY = (e.clientY - rect.top - currentView.y) / currentView.zoom;
                    const dx = mouseX - drag.startMouseX;
                    const dy = mouseY - drag.startMouseY;
                    drag.dx = dx; drag.dy = dy;
                    const el = nodeElRefs.current[draggingNodeId];
                    if (el) el.style.transform = `translate(${dx}px, ${dy}px)`;
                }
            }, [isCanvasPanning, draggingNodeId]);

            const handleGlobalMouseUp = useCallback(() => {
                setIsCanvasPanning(prevPanning => {
                    if (prevPanning) {
                        const { currentX, currentY } = panInfoRef.current;
                        setView(prev => ({ ...prev, x: currentX, y: currentY }));
                    }
                    return false;
                });

                setDraggingNodeId(prevId => {
                    const drag = dragInfoRef.current;
                    if (prevId && drag.id === prevId && (drag.dx !== 0 || drag.dy !== 0)) {
                        const finalX = drag.nodeStartX + drag.dx;
                        const finalY = drag.nodeStartY + drag.dy;
                        setData(prev => ({
                            ...prev,
                            nodes: prev.nodes.map(n => n.id === prevId ? { ...n, x: finalX, y: finalY } : n)
                        }));
                        const el = nodeElRefs.current[prevId];
                        if (el) el.style.transform = '';
                    }
                    dragInfoRef.current = { id: null, startMouseX: 0, startMouseY: 0, nodeStartX: 0, nodeStartY: 0, dx: 0, dy: 0 };
                    return null;
                });
            }, []);

            useEffect(() => {
                window.addEventListener('mousemove', handleGlobalMouseMove);
                window.addEventListener('mouseup', handleGlobalMouseUp);
                const canvasEl = canvasRef.current;
                if (canvasEl) canvasEl.addEventListener('wheel', handleCanvasWheel, { passive: false });
                
                return () => { 
                    window.removeEventListener('mousemove', handleGlobalMouseMove); 
                    window.removeEventListener('mouseup', handleGlobalMouseUp); 
                    if(canvasEl) canvasEl.removeEventListener('wheel', handleCanvasWheel);
                };
            }, [handleGlobalMouseMove, handleCanvasWheel]);

            const handleNodeClick = useCallback((e, node) => {
                e.stopPropagation(); 
                setActiveNode(node);
                setDraggingNodeId(node.id);
                setSimStep(-1);
                setIsPlaying(false);
                setActiveFlowExplanation(null);

                if (canvasRef.current) {
                    const rect = canvasRef.current.getBoundingClientRect();
                    const currentView = viewRef.current;
                    const mouseX = (e.clientX - rect.left - currentView.x) / currentView.zoom;
                    const mouseY = (e.clientY - rect.top - currentView.y) / currentView.zoom;
                    dragInfoRef.current = { id: node.id, startMouseX: mouseX, startMouseY: mouseY, nodeStartX: node.x, nodeStartY: node.y, dx: 0, dy: 0 };
                }

                if (node && node.file) {
                    const fileIdx = filesRef.current.findIndex(f => f.name === node.file);
                    if (fileIdx !== -1) setActiveFileId(fileIdx);
                }
            }, []);

            const activeCode = files[activeFileId]?.content || "";
            const lineCount = activeCode.split('\n').length;
            const lineNumbers = useMemo(
                () => Array.from({ length: Math.max(lineCount, 15) }, (_, i) => i + 1),
                [lineCount]
            );

            const renderedEdges = useMemo(() => {
                return data.edges.map((edge, i) => {
                    const from = data.nodes.find(n => n.id === edge.from);
                    const to = data.nodes.find(n => n.id === edge.to);
                    if (!from || !to) return null;
                    return { edge, from, to, key: i };
                }).filter(Boolean);
            }, [data.edges, data.nodes]);

            // Referencia estable (no cambia de identidad) para registrar los elementos DOM de cada nodo
            const registerRef = useCallback((id, el) => {
                if (el) nodeElRefs.current[id] = el;
                else delete nodeElRefs.current[id];
            }, []);

            // Recalcula los estilos de tema (colores) solo cuando cambia la paleta, no en cada render
            const nodeThemes = useMemo(() => {
                const themes = {};
                Object.keys(NODE_TYPES).forEach(type => { themes[type] = getNodeTheme(type, palette); });
                return themes;
            }, [palette]);

            return (
                <div className="flex flex-col h-full bg-[#020617] text-slate-200">
                    <div className="h-16 border-b border-slate-800 glass flex items-center px-6 justify-between z-50 shrink-0">
                        <div className="flex items-center space-x-3">
                            <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-[0_0_15px_rgba(99,102,241,0.4)]">
                                <Icons.Activity />
                            </div>
                            <h1 className="text-xl font-bold tracking-tight text-white">Code<span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">Interpreter</span> AI</h1>
                        </div>
                        <div className="flex items-center space-x-4">
                            
                            <button onClick={toggleApiMode} className={`text-xs px-4 py-2 rounded-full flex items-center space-x-2 transition-all font-bold shadow-lg ${apiMode === 'cloud' ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white hover:from-blue-500 hover:to-indigo-500' : 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white hover:from-emerald-500 hover:to-teal-500'}`} title="Cambiar motor de IA">
                                {apiMode === 'cloud' ? <Icons.Cloud /> : <Icons.Server />}
                                <span>{apiMode === 'cloud' ? 'Cloud Mode (Gemini)' : 'Local Mode (Ollama)'}</span>
                            </button>

                            {apiMode === 'local' && (

                                                        <span className="text-[10px] uppercase font-bold tracking-wider text-indigo-400">Paso ({simStep + 1}/{data.flow.length})</span>
                                                        <span className="flex h-2 w-2 relative">
                                                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                                                            <span className="relative inline-flex rounded-full h-2 w-2 bg-indigo-500"></span>
                                                        </span>
                                                    </div>
                                                    <p className="text-indigo-100 text-sm leading-relaxed">{activeFlowExplanation}</p>
                                                </div>
                                            )}
                                            
                                            <div className="p-4 rounded-xl border bg-gradient-to-br from-slate-900 to-slate-800"
                                                 style={{ borderColor: (nodeThemes[activeNode.type] || nodeThemes['function']).border }}>
                                                <div className="flex items-center justify-between mb-2">
                                                    <span className="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Bloque Inspeccionado</span>
                                                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-900/50 border"
                                                          style={{ borderColor: (nodeThemes[activeNode.type] || nodeThemes['function']).border, color: (nodeThemes[activeNode.type] || nodeThemes['function']).text }}>
                                                        {(NODE_TYPES[activeNode.type] || NODE_TYPES['function']).label}
                                                    </span>
                                                </div>
                                                <div className="font-mono font-bold text-lg break-all leading-tight"
                                                     style={{ color: (nodeThemes[activeNode.type] || nodeThemes['function']).text }}>{activeNode.label}</div>
                                            </div>
                                            
                                            <div className="bg-slate-800/30 p-3 rounded-lg border border-slate-800 flex items-center justify-between">
                                                <div className="flex items-center space-x-2">
                                                    <div className="text-slate-400"><Icons.Code /></div>
                                                    <span className="text-xs text-slate-400">Archivo:</span>
                                                </div>
                                                <span className="font-mono text-xs text-slate-300 font-semibold bg-slate-900 px-2 py-1 rounded border border-slate-700/50 truncate max-w-[120px]" title={activeNode.file}>{activeNode.file || 'Desconocido'}</span>
                                            </div>
                                            <div className="space-y-1">
                                                <div className="text-xs font-semibold text-slate-400">Propósito</div>
                                                <p className="text-slate-300 leading-relaxed bg-slate-800/30 p-3 rounded-lg border border-slate-800 text-xs">{activeNode.purpose}</p>
                                            </div>
                                            <div className="grid grid-cols-1 gap-3">
                                                <div className="bg-slate-800/30 p-3 rounded-lg border border-slate-800">
                                                    <div className="text-[10px] uppercase text-slate-500 mb-1">Entradas</div>
                                                    <div className="font-mono text-xs text-blue-300">{activeNode.inputs}</div>
                                                </div>
                                                <div className="bg-slate-800/30 p-3 rounded-lg border border-slate-800">
                                                    <div className="text-[10px] uppercase text-slate-500 mb-1">Salidas</div>
                                                    <div className="font-mono text-xs text-emerald-300">{activeNode.outputs}</div>
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="h-full flex flex-col items-center justify-center text-slate-500 space-y-4 opacity-60">
                                            <Icons.Activity />
                                            <p className="text-center px-4 text-xs">Usa el simulador inferior para recorrer el orden lógico o selecciona un bloque.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
